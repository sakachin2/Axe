apply plugin: 'com.android.application'
//vc8C 2025/04/11 Build bundle failes by "libiconv.a is reserved name".(toybox prepares iconv, but do not accep cp932 etc)
//vc8w 2025/04/06 logcat shows
//                I EmojiCompatManager: EmojiCompatManager.getEmojiCompatIfLoaded():343 EmojiCompat.init() was never called.
//                I EmojiCompatManager: java.lang.IllegalStateException: EmojiCompat is not initialized. Please call EmojiCompat.init() first
//vc8u 2025/04/06 close softKbd for closed foldable at layoutChange. befause No orientationChange ocuurs when rotated.
//vc8g 2025/03/24 drop ACRA because FATAL exception by
//                SecurityException: com.xe.AxeA9.debug: One of RECEIVER_EXPORTED or RECEIVER_NOT_EXPORTED should be specified when a receiver isn't being registered exclusively for system broadcasts
